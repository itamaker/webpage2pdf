[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpage2pdf"
version = "0.1.0"
description = "Pixel-perfect webpage → paginated PDF via headless Chrome screenshots, with title/date/URL/page-number headers and footers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zhaoyang Jia", email = "zhaoyang.jia@ieee.org" }]
requires-python = ">=3.9"
keywords = ["pdf", "screenshot", "webpage", "archive", "selenium", "chrome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "selenium>=4.6",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/itamaker/webpage2pdf"
Issues = "https://github.com/itamaker/webpage2pdf/issues"

[project.scripts]
webpage2pdf = "webpage2pdf.cli:main"

[tool.setuptools]
packages = ["webpage2pdf"]
